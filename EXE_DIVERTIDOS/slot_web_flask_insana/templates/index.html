<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>🎰 Slots Paraná</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>🎰 Slots Paraná</h1>

<div id="login">
  <input id="user" placeholder="Usuário">
  <input id="pwd" type="password" placeholder="Senha">
  <br><br>
  <button onclick="login()">Entrar</button>
  <button onclick="register()">Cadastrar</button>
</div>

<div id="game" style="display:none;">
  <h2 id="saldo"></h2>

  <div id="slots" class="slots">
    <span id="s1">❓</span>
    <span id="s2">❓</span>
    <span id="s3">❓</span>
  </div>

  <button onclick="spin()">🎰 GIRAR</button>
  <p id="msg"></p>

  <button onclick="verRanking()">🏆 Ranking</button>
  <button onclick="logout()">🚪 Sair</button>

  <h3>🎵 Áudio</h3>
  <input id="volume" type="range" min="0" max="1" step="0.1" value="0.3"
         onchange="setVolume(this.value)">
  <button onclick="toggleMute()">🔇 Mute</button>
</div>

<script src="/static/app.js"></script>
</body>
</html>
